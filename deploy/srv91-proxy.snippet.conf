# Передача запросов techagent.pro на Railway. Лежит на srv91 в /etc/nginx/snippets/techagent-proxy.conf.
# Адрес Railway через переменную: nginx заново узнаёт его IP, если Railway его сменит.
resolver 195.208.4.1 195.208.5.1 valid=300s ipv6=off;
resolver_timeout 5s;
set $techagent_railway techagent-production.up.railway.app;

proxy_http_version 1.1;
proxy_set_header Host $techagent_railway;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host techagent.pro;
proxy_ssl_server_name on;
proxy_ssl_name $techagent_railway;
proxy_redirect https://techagent-production.up.railway.app/ /;
proxy_connect_timeout 10s;
proxy_read_timeout 30s;
proxy_hide_header x-railway-request-id;
proxy_hide_header x-railway-edge;
proxy_hide_header x-railway-cdn-edge;
proxy_hide_header x-hikari-trace;

# Заявки партнёров с /register — обрабатываются здесь, на российском сервере (deploy/api/partner-application.php),
# письмом на partners@techagent.pro. Данные заявителя не уходят за пределы РФ.
location = /api/partner-application {
    client_max_body_size 32k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/techagent-api/public/partner-application.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

# Страницы — всегда свежие с Railway: правка видна сразу после выкладки
location / {
    proxy_pass https://$techagent_railway;
}
# Файлы сборки с хэшем в имени и картинки — из запаса на этом сервере
location ~ ^/(assets|images|og|icons)/ {
    proxy_pass https://$techagent_railway;
    proxy_cache techagent;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    add_header X-Cache $upstream_cache_status always;
}

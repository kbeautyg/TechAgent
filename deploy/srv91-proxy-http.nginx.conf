# Временный вариант прокладки без https — пока домен не переведён на srv91 и сертификата нет.
# После выпуска сертификата заменяется на srv91-proxy.nginx.conf.
proxy_cache_path /var/cache/nginx/techagent levels=1:2 keys_zone=techagent:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name techagent.pro www.techagent.pro;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    include snippets/techagent-proxy.conf;
}

# Прокладка для techagent.pro на srv91 (LiteHost, Россия), с 07.10.2026.
# Сайт по-прежнему живёт на Railway и обновляется оттуда сам после git push.
# Этот сервер только передаёт запросы: из России Cloudflare и Railway напрямую
# у провайдеров режутся, а российский адрес открывается у всех.
# Домен techagent.pro и www смотрят сюда (A-запись 91.230.94.123, без прокси Cloudflare).
# Сертификат Let's Encrypt: certbot certonly --webroot -w /var/www/html -d techagent.pro -d www.techagent.pro
# Лежит на сервере в /etc/nginx/sites-available/techagent.

# Неизменяемые файлы сборки (с хэшем в имени) и картинки держим у себя, чтобы не ходить за ними каждый раз
proxy_cache_path /var/cache/nginx/techagent levels=1:2 keys_zone=techagent:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name techagent.pro www.techagent.pro;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://techagent.pro$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.techagent.pro;
    ssl_certificate /etc/letsencrypt/live/techagent.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techagent.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://techagent.pro$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name techagent.pro;
    ssl_certificate /etc/letsencrypt/live/techagent.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techagent.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/techagent-proxy.conf;
}

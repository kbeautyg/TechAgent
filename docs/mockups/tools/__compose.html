<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#E9ECF3;font-family:-apple-system,sans-serif;padding:32px 32px 24px;display:flex;gap:30px}
.ph{width:410px;flex:none}
.scr{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;border:10px solid #0B1020;box-shadow:0 20px 50px rgba(11,16,32,.18);background:#fff}
.l{position:absolute;left:0;width:390px;background:url(/__tall.png) no-repeat;background-size:500px 7000px}
.cap{margin-top:16px;text-align:center;font-size:19px;font-weight:600;color:#3A4256}
</style></head><body>
<script>
const HH=80, NH=72, H=844
const shots=[[0,'Поиск и витрина'],[700,'Витрина и категории'],[1560,'Полки товаров'],[2600,'Как купить'],[3500,'Ещё полки'],[4560,'Бренды и партнёрам']]
for(const [y,t] of shots){
  const d=document.createElement('div');d.className='ph'
  d.innerHTML=`<div class="scr">
    <div class="l" style="top:${HH}px;height:${H-HH-NH}px;background-position:0 -${y+HH}px"></div>
    <div class="l" style="top:0;height:${HH}px;background-position:0 0"></div>
    <div class="l" style="bottom:0;height:${NH}px;background-position:0 -${7000-NH}px"></div>
  </div><div class="cap">${t}</div>`
  document.body.appendChild(d)
}
</script></body></html>

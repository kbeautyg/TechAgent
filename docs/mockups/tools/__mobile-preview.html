<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#E9ECF3;font-family:-apple-system,sans-serif;padding:28px 28px 20px;display:flex;gap:28px}
.ph{width:390px;flex:none}
.scr{width:390px;height:844px;border-radius:44px;overflow:hidden;border:10px solid #0B1020;box-shadow:0 20px 50px rgba(11,16,32,.18);background:#fff}
iframe{width:390px;height:844px;border:0;display:block}
.cap{margin-top:14px;text-align:center;font-size:18px;font-weight:600;color:#3A4256}
</style></head><body>
<script>
const shots=[[0,'Начало: поиск и витрина'],[700,'Витрина и категории'],[1560,'Полки товаров'],[2560,'Как купить'],[3480,'Ещё полки'],[4450,'Бренды и партнёрам']];
for(const [y,t] of shots){
  const d=document.createElement('div');d.className='ph';
  d.innerHTML='<div class="scr"><iframe src="/"></iframe></div><div class="cap">'+t+'</div>';
  document.body.appendChild(d);
  const f=d.querySelector('iframe');
  f.onload=()=>{try{f.contentWindow.localStorage.removeItem('techagent.cart')}catch(e){};setTimeout(()=>{const w=f.contentWindow,doc=w.document;w.scrollTo(0,y);doc.documentElement.scrollTop=y;doc.body.scrollTop=y;doc.querySelectorAll('#root,#root>div').forEach(e=>e.scrollTop=y)},2500)};
}
</script></body></html>
